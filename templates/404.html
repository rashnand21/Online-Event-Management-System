{% extends "base.html" %}

{% block title %}Page Not Found | EventPro{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="container text-center">
        <i class="bi bi-compass" style="font-size:5rem;color:#1a9e5c;"></i>
        <h1 class="mt-3" style="font-size:4rem;font-weight:800;">404</h1>
        <h3>Page not found</h3>
        <p class="text-muted">The page you are looking for does not exist or has been moved.</p>
        <div class="d-flex gap-2 justify-content-center flex-wrap">
            <a href="{{ url_for('index') }}" class="btn btn-brand btn-lg">Go to home</a>
            <a href="{{ url_for('events') }}" class="btn btn-outline-brand btn-lg">Browse events</a>
        </div>
    </div>
</section>

{% endblock %}
