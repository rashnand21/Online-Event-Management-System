{% extends "base.html" %}

{% block title %}Create Event | EventPro{% endblock %}

{% block content %}

<section class="page-header">
    <div class="container">
        <h1>Create a new event</h1>
        <p>Fill in the details. Your event will be listed as Upcoming.</p>
    </div>
</section>

<section class="section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <form method="POST" action="{{ url_for('create_event') }}" class="detail-box">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Event name</label>
                            <input type="text" name="event_name" class="form-control" maxlength="50" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Event type</label>
                            <select name="event_type" class="form-select" required>
                                <option value="">Select type</option>
                                <option>Conference</option>
                                <option>Concert</option>
                                <option>Seminar</option>
                                <option>Exhibition</option>
                                <option>Festival</option>
                                <option>Workshop</option>
                                <option>Networking</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Location (city)</label>
                            <input type="text" name="location" class="form-control" maxlength="50" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Maximum capacity</label>
                            <input type="number" name="max_capacity" class="form-control" min="1" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Booking closes on</label>
                            <input type="date" name="booking_before" id="bookingBefore" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Event date</label>
                            <input type="date" name="event_date" id="eventDate" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Event time</label>
                            <input type="time" name="event_time" class="form-control" required>
                        </div>
                    </div>
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-brand">Create event</button>
                        <a href="{{ url_for('dashboard') }}" class="btn btn-outline-brand">Back</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>

{% endblock %}

{% block extra_js %}
<script>
    const today = new Date().toISOString().split('T')[0];
    const bookingBefore = document.getElementById('bookingBefore');
    const eventDate = document.getElementById('eventDate');
    bookingBefore.min = today;
    eventDate.min = today;
    bookingBefore.addEventListener('change', function () {
        eventDate.min = bookingBefore.value;
    });
</script>
{% endblock %}
