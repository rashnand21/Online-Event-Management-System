{% extends "base.html" %}

{% block title %}Log in | EventPro{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="auth-card">
                    <h3 class="text-center">Log in to EventPro</h3>
                    <p class="text-center text-muted">Choose your role and enter your ID and password.</p>

                    <form method="POST" action="{{ url_for('login') }}">
                        <div class="mb-3">
                            <label class="form-label">Login as</label>
                            <select name="role" class="form-select" required>
                                <option value="user" {% if request.args.get('role') == 'user' %}selected{% endif %}>User</option>
                                <option value="organizer" {% if request.args.get('role') == 'organizer' %}selected{% endif %}>Organizer</option>
                                <option value="admin" {% if request.args.get('role') == 'admin' %}selected{% endif %}>Admin</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">ID</label>
                            <input type="number" name="user_id" class="form-control" placeholder="Enter your ID" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
                        </div>
                        <button type="submit" class="btn btn-brand w-100 btn-lg">Log in</button>
                    </form>

                    <p class="text-center mt-3 mb-0">Don't have an account? <a href="{{ url_for('register') }}">Register</a></p>
                </div>
            </div>
        </div>
    </div>
</section>

{% endblock %}
